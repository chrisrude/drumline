# Dependabot version updates.  This repo is three separate npm packages
# (not an npm workspace), so each one is listed here.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
    - package-ecosystem: 'npm'
      directory: '/'
      schedule:
          interval: 'weekly'
    - package-ecosystem: 'npm'
      directory: '/drumline-lib'
      schedule:
          interval: 'weekly'
    - package-ecosystem: 'npm'
      directory: '/drumline-server'
      schedule:
          interval: 'weekly'
    - package-ecosystem: 'npm'
      directory: '/drumline-client'
      schedule:
          interval: 'weekly'
    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'weekly'
